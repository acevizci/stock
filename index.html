<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hisse Takibi</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/dist/tabler-icons.min.css" />
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">

  <!-- App styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <!-- Header -->
  <div class="hdr">
    <div class="h-brand">
      <div class="h-logo"><i class="ti ti-trending-up"></i></div>
      <span class="h-title">Hisse Takibi</span>
      <div class="live-tag" id="live-tag"><div class="live-dot"></div>CANLI</div>
    </div>
    <div class="h-right">
      <span class="upd-txt" id="upd"></span>
      <button class="btn btn-icon btn-bell" id="bell-btn" onclick="toggleNotif()" title="Düşüş bildirimleri">
        <i class="ti ti-bell"></i>
      </button>
      <button class="btn" id="ref-btn" onclick="refreshAll()" style="display:none">
        <i class="ti ti-refresh" id="ref-icon"></i> Yenile
      </button>
      <button class="btn btn-primary" onclick="openModal()">
        <i class="ti ti-plus"></i> Hisse Ekle
      </button>
    </div>
  </div>

  <!-- Summary bar -->
  <div class="sbar" id="sbar" style="display:none">
    <div class="sc">
      <div class="sc-l">Toplam</div>
      <div class="sc-v" id="sc-t">0</div>
    </div>
    <div class="sc">
      <div class="sc-l">Yükselen</div>
      <div class="sc-v" id="sc-u" style="color:var(--up)">0</div>
    </div>
    <div class="sc">
      <div class="sc-l">Düşen</div>
      <div class="sc-v" id="sc-d" style="color:var(--dn)">0</div>
    </div>
  </div>



  <!-- Empty state -->
  <div class="empty" id="empty-state">
    <div class="empty-icon"><i class="ti ti-chart-candle"></i></div>
    <div class="empty-t">Takip listesi boş</div>
    <div class="empty-s">Hisse Ekle butonuyla<br>takip başlatabilirsin.</div>
  </div>

  <!-- Stock grid -->
  <div class="grid" id="grid"></div>

</div><!-- /app-shell -->

<!-- Hisse ekleme modalı -->
<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">Hisse Ekle</span>
      <button class="modal-x" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="info-note">
      <i class="ti ti-info-circle"></i>
      Veriler Yahoo Finance'den gerçek zamanlı çekilmektedir.
    </div>

    <div class="s-wrap">
      <i class="ti ti-search"></i>
      <input class="s-inp" id="search-inp" type="text"
             placeholder="Sembol veya şirket adı..."
             oninput="filterList()" autocomplete="off" />
    </div>
    <div>
      <button class="div-filter-btn" id="div-filter-btn" onclick="toggleDivFilter()">
        <i class="ti ti-coin"></i> Sadece temettü hisseleri
      </button>
    </div>
    <div class="s-list" id="s-list"></div>
    <div class="divider">veya manuel gir</div>
    <div class="m-row">
      <input class="ci" id="m-sym"  type="text" placeholder="Sembol"
             style="width:95px" maxlength="12" oninput="clearErr()" />
      <input class="ci" id="m-name" type="text" placeholder="Şirket adı"
             style="flex:1;min-width:100px" oninput="clearErr()" />
      <select class="ci" id="m-exch">
        <option value="BIST">BIST</option>
       
      </select>
    </div>
    <div class="cerr" id="cerr"></div>
    <div class="m-footer">
      <button class="btn"         onclick="closeModal()">Vazgeç</button>
      <button class="btn btn-primary" onclick="addManual()">Ekle</button>
    </div>
  </div>
</div>

<!-- Düşüş toast bildirimi -->
<div class="toast" id="toast">
  <button class="toast-close" onclick="this.parentElement.classList.remove('show')">
    <i class="ti ti-x"></i>
  </button>
  <div class="toast-sym"  id="toast-sym"></div>
  <div class="toast-body" id="toast-body"></div>
</div>

<!-- Grafik Modalı -->
<div class="chart-overlay" id="chart-overlay" onclick="if(event.target===this)closeChartModal()">
  <div class="chart-modal">
    <div class="cm-hdr">
      <div class="cm-hdr-left">
        <div class="cm-sym-wrap">
          <span class="cm-title" id="cm-title"></span>
          <span class="cm-name"  id="cm-name"></span>
        </div>
        <div class="cm-ohlc" id="cm-ohlc"></div>
      </div>
      <div class="cm-hdr-right">
        <div class="cm-ranges">
          <button class="cm-range-btn" data-range="1mo"  onclick="cmChangeRange('1mo')">1A</button>
          <button class="cm-range-btn" data-range="3mo"  onclick="cmChangeRange('3mo')">3A</button>
          <button class="cm-range-btn" data-range="6mo"  onclick="cmChangeRange('6mo')">6A</button>
          <button class="cm-range-btn active" data-range="1y" onclick="cmChangeRange('1y')">1Y</button>
          <button class="cm-range-btn" data-range="5y"   onclick="cmChangeRange('5y')">5Y</button>
        </div>
        <button class="cm-close" onclick="closeChartModal()"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div class="cm-loading" id="cm-loading" style="display:none">
      <i class="ti ti-loader" style="animation:spin 1s linear infinite;font-size:20px;color:var(--muted)"></i>
    </div>
    <div class="cm-chart-wrap">
      <div class="cm-chart" id="cm-chart"></div>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<!-- App logic -->
<script src="app.js"></script>

</body>
</html>
